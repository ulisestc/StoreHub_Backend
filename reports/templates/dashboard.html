<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reportes</title>
    <style>
        .btn {
            display: inline-block;
            padding: 10px 18px;
            margin: 8px;
            background:#2b6cb0;
            color:#fff;
            text-decoration:none;
            border-radius:6px;
            font-family: Arial, sans-serif;
        }
        .btn:hover { background:#234e86; }
        .container { padding: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World!</h1>
        <p>Welcome to my first Django project!</p>

        <div>
            <label for="start_date">Fecha inicio:</label>
            <input type="date" id="start_date" name="start_date" style="width:160px; margin-right:8px;">

            <label for="end_date">Fecha fin:</label>
            <input type="date" id="end_date" name="end_date" style="width:160px; margin-right:8px;">

            <a class="btn" href="#" onclick="event.preventDefault(); const s=document.getElementById('start_date').value; const e=document.getElementById('end_date').value; const params=new URLSearchParams(); if(s) params.append('start_date', s); if(e) params.append('end_date', e); const url='/api/reports/sales-by-date/' + (params.toString() ? '?' + params.toString() : ''); window.open(url, '_blank');">Ventas por fecha</a>
            <!-- <a class="btn" href="/api/reports/sales-by-date/" target="_blank">Ventas por fecha</a> -->
            <hr>
            <input type="number" id="limit" name="limit" value="10" min="0" style="width:80px;">
            <a class="btn" href="#" onclick="event.preventDefault(); const limitVal = document.getElementById('limit').value; const urlTop = '/api/reports/top-products/?limit=' + encodeURIComponent(limitVal); window.open(urlTop, '_blank');">Productos más vendidos</a>
            <hr>
            <input type="number" id="threshold" name="threshold" value="10" min="0" style="width:80px;">
            <a class="btn" href="#" onclick="event.preventDefault(); const thresholdVal = document.getElementById('threshold').value; const urlLow = '/api/reports/low-stock-products/?threshold=' + encodeURIComponent(thresholdVal); window.open(urlLow, '_blank');">Productos con stock bajo</a>
        </div>
    </div>
</body>
</html>
